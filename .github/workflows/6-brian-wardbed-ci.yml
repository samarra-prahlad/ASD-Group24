name: Student 6 - Ward Bed CI

on:
  push:
    branches: [main]
    paths:
      - '6-brian-wardbed/**'
      - '.github/workflows/6-brian-wardbed-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '6-brian-wardbed/**'
      - '.github/workflows/6-brian-wardbed-ci.yml'

jobs:
  pytest-validation:
    name: Pre-commit pytest validation
    runs-on: ubuntu-latest

    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shared service dependencies
        run: |
          pip install -r shared/database/requirements.txt
          pip install -r shared/backend/requirements.txt

      - name: Install ward bed dependencies
        run: |
          pip install -r 6-brian-wardbed/backend/requirements.txt
          pip install -r 6-brian-wardbed/database/requirements.txt
          pip install pytest requests

      - name: Run pytest
        run: python -m pytest 6-brian-wardbed/tests/ -v

  ai-assisted-testing:
    name: Post-commit AI-assisted unit testing
    needs: pytest-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for AI-assisted test step
        run: echo "AI-assisted unit testing step - to be implemented"