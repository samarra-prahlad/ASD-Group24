name: Student 6 - Ward Bed CI

on:
  push:
    branches: [main]
    paths:
      - '6-brian-wardbed/**'
      - '.github/workflows/6-brian-wardbed-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '6-brian-wardbed/**'
      - '.github/workflows/6-brian-wardbed-ci.yml'

jobs:
  pytest-validation:
    name: Pre-commit pytest validation
    runs-on: ubuntu-latest

    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shared service dependencies
        run: |
          pip install -r shared/database/requirements.txt
          pip install -r shared/backend/requirements.txt

      - name: Install ward bed dependencies
        run: |
          pip install -r 6-brian-wardbed/backend/requirements.txt
          pip install -r 6-brian-wardbed/database/requirements.txt
          pip install pytest requests
      
      - name: Initialise shared database
        run: python shared/database/init_db.py

      - name: Start shared database service
        run: python shared/database/app.py &
        env:
          PORT: 6000

      - name: Start shared backend service
        run: python shared/backend/app.py &
        env:
          PORT: 5000
      
      - name: Initialise ward bed database
        run: |
          mkdir -p 6-brian-wardbed/database/data
          python 6-brian-wardbed/database/init_db.py

      - name: Start ward bed database service
        run: nohup python 6-brian-wardbed/database/app.py > wardbed-database.log 2>&1 &
        env:
          PORT: 6006

      - name: Wait for ward bed database
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:6006/ || true)
            if [ "$code" != "000" ]; then echo "Database ready"; exit 0; fi
            sleep 1
          done
          cat wardbed-database.log
          exit 1
      
      - name: Start ward bed backend service
        run: python 6-brian-wardbed/backend/app.py &
        env:
          PORT: 5006      

      - name: Run pytest
        run: python -m pytest 6-brian-wardbed/tests/ -v
        env:
          PYTHONPATH: 6-brian-wardbed/backend
          DATABASE_SERVICE_URL: http://localhost:6006  

  ai-assisted-testing:
    name: Post-commit AI-assisted unit testing
    needs: pytest-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for AI-assisted test step
        run: echo "AI-assisted unit testing step - to be implemented"