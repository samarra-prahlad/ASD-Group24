name: Student 6 - Ward Bed CI

on:
  push:
    branches: [main]
    paths:
      - '6-brian-wardbed/**'
  pull_request:
    branches: [main]
    paths:
      - '6-brian-wardbed/**'

jobs:
  pytest-validation:
    name: Pre-commit pytest validation
    runs-on: ubuntu-latest

    env:
      MCP_ENABLED: "false"
      RAG_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shared service dependencies
        run: |
          pip install -r shared/database/requirements.txt
          pip install -r shared/backend/requirements.txt

      - name: Install ward bed dependencies
        run: |
          pip install -r 6-brian-wardbed/backend/requirements.txt
          pip install -r 6-brian-wardbed/database/requirements.txt
          pip install pytest requests

      - name: Initialise shared database
        run: python shared/database/init_db.py

      - name: Initialise ward bed database
        run: python 6-brian-wardbed/database/init_db.py

      - name: Start shared database service
        run: python shared/database/app.py &
        env:
          PORT: 6000

      - name: Start shared backend service
        run: python shared/backend/app.py &
        env:
          PORT: 5000

      - name: Start ward bed database service
        run: python 6-brian-wardbed/database/app.py &
        env:
          PORT: 6006

      - name: Start ward bed backend service
        run: python 6-brian-wardbed/backend/app.py &
        env:
          PORT: 5006

      - name: Wait for all services to be ready
        run: |
          for port in 6000 5000 6006 5006; do
            echo "Waiting for service on port $port..."
            for i in $(seq 1 60); do
              if curl -sf "http://localhost:$port/" > /dev/null 2>&1; then
                echo "Port $port is ready."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Service on port $port did not become ready in time."
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run pytest
        run: pytest 6-brian-wardbed/tests/ -v

  ai-assisted-testing:
    name: Post-commit AI-assisted unit testing
    needs: pytest-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for AI-assisted test step
        run: echo "AI-assisted unit testing step — to be implemented"