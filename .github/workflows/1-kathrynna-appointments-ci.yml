name: Student 1 - Appointments CI

on:
  push:
    branches: [main]
    paths:
      - "1-kathrynna-appointments/**"
      - ".github/workflows/1-kathrynna-appointments-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/1-kathrynna-appointments-ci.yml"
      - "1-kathrynna-appointments/**"

jobs:
  pytest-validation:
    name: Pre-commit pytest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install shared service dependencies
        run: |
          pip install -r shared/database/requirements.txt
          pip install -r shared/backend/requirements.txt

      - name: Install appointments dependencies
        run: |
          pip install -r 1-kathrynna-appointments/backend/requirements.txt
          pip install -r 1-kathrynna-appointments/database/requirements.txt
          pip install pytest requests

      - name: Initialise shared database
        run: python shared/database/init_db.py

      - name: Initialise appointments database
        run: python 1-kathrynna-appointments/database/init_db.py

      - name: Start shared database service
        run: python shared/database/app.py &
        env:
          PORT: 6000

      - name: Start shared backend service
        run: python shared/backend/app.py &
        env:
          PORT: 5000

      - name: Start appointments database service
        run: python 1-kathrynna-appointments/database/app.py &
        env:
          PORT: 6001

      - name: Start appointments backend service
        run: python 1-kathrynna-appointments/backend/app.py &
        env:
          PORT: 5001

      - name: Wait for all services to be ready
        run: |
          for port in 6000 5000 6001 5001; do
            echo "Waiting for service on port $port..."
            for i in $(seq 1 60); do
              if curl -sf "http://localhost:$port/" > /dev/null 2>&1; then
                echo "Port $port is ready."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Service on port $port did not become ready in time."
                exit 1
              fi
              sleep 1
            done
          done

      - name: Debug - check services are still alive
        run: |
          ps aux | grep python
          curl -v http://localhost:6001/ || echo "port 6001 is down"


      - name: Run pytest
        run: pytest 1-kathrynna-appointments/tests/ -v

  ai-assisted-testing:
    name: Post-commit AI-assisted unit testing
    needs: pytest-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for AI-assisted test step
        run: echo "AI-assisted unit testing step — to be implemented"