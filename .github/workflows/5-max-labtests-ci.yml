name: Student 5 - Lab Tests CI

on:
  push:
    branches: [main]
    paths:
      - '5-max-labtests/**'
  pull_request:
    branches: [main]
    paths:
      - '5-max-labtests/**'

jobs:
  pytest-validation:
    name: Pre-commit pytest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install shared service dependencies
        run: |
          pip install -r shared/database/requirements.txt
          pip install -r shared/backend/requirements.txt

      - name: Install lab tests dependencies
        run: |
          pip install -r 5-max-labtests/backend/requirements.txt
          pip install -r 5-max-labtests/database/requirements.txt
          pip install pytest requests

      - name: Initialise shared database
        run: python shared/database/init_db.py

      - name: Initialise lab tests database
        run: python 5-max-labtests/database/init_db.py

      - name: Start shared database service
        run: python shared/database/app.py &

      - name: Start shared backend service
        run: python shared/backend/app.py &
        env:
          DATABASE_SERVICE_URL: http://localhost:6000

      - name: Start lab tests database service
        run: python 5-max-labtests/database/app.py &

      - name: Start lab tests backend service
        run: python 5-max-labtests/backend/app.py &
        env:
          DATABASE_SERVICE_URL: http://localhost:6005
          SHARED_ACCESS_API_URL: http://localhost:5000
          SHARED_DATABASE_URL: http://localhost:6000
          MCP_RAG_ENABLED: "false"

      - name: Wait for all services to be ready
        run: |
          for port in 6000 5000 6005 5005; do
            echo "Waiting for service on port $port..."
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:$port/" || true)
              if [ "$code" != "000" ]; then
                echo "Port $port is ready."
                break
              fi
              if [ "$i" -eq 60 ]; then
                echo "Service on port $port did not become ready in time."
                exit 1
              fi
              sleep 1
            done
          done

      - name: Run pytest
        run: pytest 5-max-labtests/tests/ -v

      - name: Release 2 endpoint tests (POST /orders and GET /orders/id)
        run: pytest 5-max-labtests/tests/test_endpoints_release2.py -v --junitxml=labtests-endpoint-tests.xml

      - name: Upload endpoint test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: labtests-endpoint-test-report
          path: labtests-endpoint-tests.xml

  ai-assisted-testing:
    name: Post-commit AI-assisted unit testing
    needs: pytest-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder for AI-assisted test step
        run: echo "AI-assisted unit testing step — to be implemented"