services:
  # ---------- Shared microservice (team-owned) ----------
  shared-frontend:
    build:
      context: ./shared/frontend
    container_name: shared-frontend
    ports:
      - "3000:80"
    depends_on:
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  shared-backend:
    build:
      context: ./shared/backend
    container_name: shared-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_SERVICE_URL: http://shared-database:6000
    depends_on:
      - shared-database
    networks:
      - healthcare-network
    restart: unless-stopped

  shared-database:
    build:
      context: ./shared/database
    container_name: shared-database
    ports:
      - "6000:6000"
    volumes:
      - shared_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- AI services ----------
  ai-mode:
    build:
      context: ./ai-services/ai-mode
    container_name: ai-mode
    ports:
      - "5100:5100"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_REVIEW_MODEL: llama3.1:8b
      SHARED_ACCESS_API_URL: http://shared-backend:5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 1: Appointments (Kathrynna) ----------
  appointments-frontend:
    build:
      context: ./1-kathrynna-appointments/frontend
    container_name: appointments-frontend
    ports:
      - "3100:80"
    depends_on:
      - appointments-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  appointments-backend:
    build:
      context: ./1-kathrynna-appointments/backend
    container_name: appointments-backend
    ports:
      - "5101:5101"
    environment:
      DATABASE_SERVICE_URL: http://appointments-database:6101
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - appointments-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  appointments-database:
    build:
      context: ./1-kathrynna-appointments/database
    container_name: appointments-database
    ports:
      - "6101:6101"
    volumes:
      - appointments_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 2: EHR (Divyansh) ----------
  ehr-frontend:
    build:
      context: ./2-div-ehr/frontend
    container_name: ehr-frontend
    ports:
      - "3200:80"
    depends_on:
      - ehr-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  ehr-backend:
    build:
      context: ./2-div-ehr/backend
    container_name: ehr-backend
    ports:
      - "5102:5102"
    environment:
      DATABASE_SERVICE_URL: http://ehr-database:6102
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ehr-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  ehr-database:
    build:
      context: ./2-div-ehr/database
    container_name: ehr-database
    ports:
      - "6102:6102"
    volumes:
      - ehr_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 3: Pharmacy (William) ----------
  pharmacy-frontend:
    build:
      context: ./3-william-pharmacy/frontend
    container_name: pharmacy-frontend
    ports:
      - "3300:80"
    depends_on:
      - pharmacy-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  pharmacy-backend:
    build:
      context: ./3-william-pharmacy/backend
    container_name: pharmacy-backend
    ports:
      - "5103:5103"
    environment:
      DATABASE_SERVICE_URL: http://pharmacy-database:6103
      EHR_DATABASE_API_URL: http://ehr-backend:5102
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pharmacy-database
      - shared-backend
      - ehr-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  pharmacy-database:
    build:
      context: ./3-william-pharmacy/database
    container_name: pharmacy-database
    ports:
      - "6103:6103"
    volumes:
      - pharmacy_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 4: Billing & Insurance (Samarra) ----------
  billing-frontend:
    build:
      context: ./4-samarra-billing/frontend
    container_name: billing-frontend
    ports:
      - "3400:80"
    depends_on:
      - billing-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  billing-backend:
    build:
      context: ./4-samarra-billing/backend
    container_name: billing-backend
    ports:
      - "5104:5104"
    environment:
      DATABASE_SERVICE_URL: http://billing-database:6104
      APPOINTMENTS_DATABASE_API_URL: http://appointments-backend:5101
      PHARMACY_DATABASE_API_URL: http://pharmacy-backend:5103
      WARDBED_DATABASE_API_URL: http://wardbed-backend:5106
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - billing-database
      - shared-backend
      - appointments-backend
      - pharmacy-backend
      - wardbed-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  billing-database:
    build:
      context: ./4-samarra-billing/database
    container_name: billing-database
    ports:
      - "6104:6104"
    volumes:
      - billing_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 5: Lab Tests (Maximilian) ----------
  labtests-frontend:
    build:
      context: ./5-max-labtests/frontend
    container_name: labtests-frontend
    ports:
      - "3500:80"
    depends_on:
      - labtests-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  labtests-backend:
    build:
      context: ./5-max-labtests/backend
    container_name: labtests-backend
    ports:
      - "5105:5105"
    environment:
      DATABASE_SERVICE_URL: http://labtests-database:6105
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - labtests-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  labtests-database:
    build:
      context: ./5-max-labtests/database
    container_name: labtests-database
    ports:
      - "6105:6105"
    volumes:
      - labtests_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 6: Ward & Bed Management (Brian) ----------
  wardbed-frontend:
    build:
      context: ./6-brian-wards/frontend
    container_name: wardbed-frontend
    ports:
      - "3600:80"
    depends_on:
      - wardbed-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  wardbed-backend:
    build:
      context: ./6-brian-wards/backend
    container_name: wardbed-backend
    ports:
      - "5106:5106"
    environment:
      DATABASE_SERVICE_URL: http://wardbed-database:6106
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - wardbed-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  wardbed-database:
    build:
      context: ./6-brian-wards/database
    container_name: wardbed-database
    ports:
      - "6106:6106"
    volumes:
      - wardbed_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

volumes:
  shared_data:
  appointments_data:
  ehr_data:
  pharmacy_data:
  billing_data:
  labtests_data:
  wardbed_data:

networks:
  healthcare-network:
    driver: bridge