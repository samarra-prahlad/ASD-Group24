services:
  # ---------- Shared microservice (team-owned) ----------
  shared-frontend:
    build:
      context: ./shared/frontend
    container_name: shared-frontend
    ports:
      - "3000:80"
    depends_on:
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  shared-backend:
    build:
      context: ./shared/backend
    container_name: shared-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_SERVICE_URL: http://shared-database:6000
    depends_on:
      - shared-database
    networks:
      - healthcare-network
    restart: unless-stopped

  shared-database:
    build:
      context: ./shared/database
    container_name: shared-database
    ports:
      - "6000:6000"
    volumes:
      - shared_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped
 

  # ---------- Student 3: Pharmacy (William) ----------
  pharmacy-frontend:
    build:
      context: ./3-william-pharmacy/frontend
    container_name: pharmacy-frontend
    ports:
      - "3003:80"
    depends_on:
      - pharmacy-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  pharmacy-backend:
    build:
      context: ./3-william-pharmacy/backend
    container_name: pharmacy-backend
    ports:
      - "5003:5003"
    environment:
      DATABASE_SERVICE_URL: http://pharmacy-database:6003
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pharmacy-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  pharmacy-database:
    build:
      context: ./3-william-pharmacy/database
    container_name: pharmacy-database
    ports:
      - "6003:6003"
    volumes:
      - pharmacy_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped


volumes:
  shared_data:
  pharmacy_data:

networks:
  healthcare-network:
    driver: bridge