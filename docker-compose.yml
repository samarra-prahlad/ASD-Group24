services:
  # ---------- Shared microservice (team-owned) ----------
  shared-frontend:
    build:
      context: ./shared/frontend
    container_name: shared-frontend
    ports:
      - "3000:80"
    depends_on:
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  shared-backend:
    build:
      context: ./shared/backend
    container_name: shared-backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_SERVICE_URL: http://shared-database:6000
    depends_on:
      - shared-database
    networks:
      - healthcare-network
    restart: unless-stopped

  shared-database:
    build:
      context: ./shared/database
    container_name: shared-database
    ports:
      - "6000:6000"
    volumes:
      - shared_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped
  # ---------- Student 1: Appointments (Kathrynna) ----------
  appointments-frontend:
    build:
      context: ./1-kathrynna-appointments/frontend
    container_name: appointments-frontend
    ports:
      - "3001:80"
    depends_on:
      - appointments-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  appointments-backend:
    build:
      context: ./1-kathrynna-appointments/backend
    container_name: appointments-backend
    ports:
      - "5001:5001"
    environment:
      DATABASE_SERVICE_URL: http://appointments-database:6001
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://host.docker.internal:7000/mcp
      RAG_SERVER_URL: http://host.docker.internal:7001/mcp
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://host.docker.internal:7002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - appointments-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  appointments-database:
    build:
      context: ./1-kathrynna-appointments/database
    container_name: appointments-database
    environment:
      DATA_DIR: /app/data
    ports:
      - "6001:6001"
    volumes:
      - appointments_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # # ---------- Student 2: EHR (Divyansh) ----------
  ehr-frontend:
    build:
      context: ./2-div-ehr/frontend
    container_name: ehr-frontend
    ports:
      - "3002:80"
    depends_on:
      - ehr-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  ehr-backend:
    build:
      context: ./2-div-ehr/backend
    container_name: ehr-backend
    ports:
      - "5002:5002"
    environment:
      DATABASE_SERVICE_URL: http://ehr-database:6002
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://host.docker.internal:7000/mcp
      RAG_SERVER_URL: http://host.docker.internal:7001/mcp
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://host.docker.internal:7002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ehr-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  ehr-database:
    build:
      context: ./2-div-ehr/database
    container_name: ehr-database
    ports:
      - "6002:6002"
    volumes:
      - ehr_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 3: Pharmacy (William) ----------
  pharmacy-frontend:
    build:
      context: ./3-william-pharmacy/frontend
    container_name: pharmacy-frontend
    ports:
      - "3003:80"
    depends_on:
      - pharmacy-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  pharmacy-backend:
    build:
      context: ./3-william-pharmacy/backend
    container_name: pharmacy-backend
    ports:
      - "5003:5003"
    environment:
      DATABASE_SERVICE_URL: http://pharmacy-database:6003
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://host.docker.internal:7000/mcp
      RAG_SERVER_URL: http://host.docker.internal:7001/mcp
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://host.docker.internal:7002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - pharmacy-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  pharmacy-database:
    build:
      context: ./3-william-pharmacy/database
    container_name: pharmacy-database
    ports:
      - "6003:6003"
    volumes:
      - pharmacy_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 4: Billing & Insurance (Samarra) ----------
  billing-frontend:
    build:
      context: ./4-samarra-billing/frontend
    container_name: billing-frontend
    ports:
      - "3004:80"
    depends_on:
      - billing-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  billing-backend:
    build:
      context: ./4-samarra-billing/backend
    container_name: billing-backend
    ports:
      - "5004:5004"
    environment:
      DATABASE_SERVICE_URL: http://billing-database:6004
      APPOINTMENTS_DATABASE_API_URL: http://appointments-backend:5001
      PHARMACY_DATABASE_API_URL: http://pharmacy-backend:5003
      # WARDBED_DATABASE_API_URL: http://wardbed-backend:5006
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://host.docker.internal:7000/mcp
      RAG_SERVER_URL: http://host.docker.internal:7001/mcp
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://host.docker.internal:7002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - billing-database
      - shared-backend
      - appointments-backend
      - pharmacy-backend
      # - wardbed-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  billing-database:
    build:
      context: ./4-samarra-billing/database
    container_name: billing-database
    ports:
      - "6004:6004"
    volumes:
      - billing_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

  # ---------- Student 5: Lab Tests (Maximilian) ----------
  labtests-frontend:
    build:
      context: ./5-max-labtests/frontend
    container_name: labtests-frontend
    ports:
      - "3005:80"
    depends_on:
      - labtests-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  labtests-backend:
    build:
      context: ./5-max-labtests/backend
    container_name: labtests-backend
    ports:
      - "5005:5005"
    environment:
      DATABASE_SERVICE_URL: http://labtests-database:6005
      SHARED_ACCESS_API_URL: http://shared-backend:5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      OLLAMA_MODEL: qwen2.5:0.5b
      MCP_SERVER_URL: http://host.docker.internal:7000/mcp
      RAG_SERVER_URL: http://host.docker.internal:7001/mcp
      MULTI_AGENT_ENABLED: "true"
      MULTI_AGENT_SERVER_URL: http://host.docker.internal:7002
      MCP_RAG_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - labtests-database
      - shared-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  labtests-database:
    build:
      context: ./5-max-labtests/database
    container_name: labtests-database
    environment:
      DATA_DIR: /app/data
    ports:
      - "6005:6005"
    volumes:
      - labtests_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

#---------- Student 6: Ward & Bed Management (Brian) ----------
  wardbed-frontend:
    build:
      context: ./6-brian-wardbed/frontend
    container_name: wardbed-frontend
    ports:
      - "3006:80"
    depends_on:
      - wardbed-backend
    networks:
      - healthcare-network
    restart: unless-stopped

  wardbed-backend:
     build:
       context: ./6-brian-wardbed/backend
     container_name: wardbed-backend
     ports:
       - "5006:5006"
     environment:
       FLASK_DEBUG: "0"
       DATABASE_SERVICE_URL: http://wardbed-database:6006
       SHARED_ACCESS_API_URL: http://shared-backend:5000
       OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
       OLLAMA_MODEL: qwen2.5:0.5b
       MCP_ENABLED: "true"
       MCP_SERVER_URL: http://host.docker.internal:7000/mcp

       RAG_ENABLED: "true"
       RAG_SERVER_URL: http://host.docker.internal:7001/mcp
       MULTI_AGENT_ENABLED: "true"
       MULTI_AGENT_SERVER_URL: http://host.docker.internal:7002
     extra_hosts:
       - "host.docker.internal:host-gateway"
     depends_on:
       - wardbed-database
       - shared-backend
     networks:
       - healthcare-network
     restart: unless-stopped

  wardbed-database:
    build:
      context: ./6-brian-wardbed/database
    container_name: wardbed-database
    environment:
      FLASK_DEBUG: "0"
    ports:
      - "6006:6006"
    volumes:
      - wardbed_data:/app/data
    networks:
      - healthcare-network
    restart: unless-stopped

volumes:
  shared_data:
  appointments_data:
  ehr_data:
  pharmacy_data:
  billing_data:
  labtests_data:
  wardbed_data:

networks:
  healthcare-network:
    driver: bridge
