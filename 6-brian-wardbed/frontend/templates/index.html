<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Ward management</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header>
        <h1>WARD MANAGEMENT</h1>
        <P id="instructionText">Please select the ward you are assigning the patient</P>
        <a href="http://localhost:5000/home" id="Homepagetext">Return to home page</a>
    </header>
    <main>
        <div class="MainMenu">
            <div class="selectionBox" onclick="selectWard(1)">
                <p>General Medicine Ward</p>
            </div>
            <div class="selectionBox" onclick="selectWard(2)">
                <p>Emergency Ward</p>
            </div>
            <div class="selectionBox" onclick="selectWard(3)">
                <p>maternity ward</p>
            </div>
            <div class="selectionBox" onclick="selectWard(4)">
                <p>Intensive Care Unit</p>
            </div>
            <div class="selectionBox" onclick="selectWard(5)">
                <p>Surgical Ward</p>
            </div>
            <div class="selectionBox" onclick="selectWard(6)">
                <p>Pediatric Ward</p>
            </div>
        </div>
    </main>

    <script>
            async function checkAuth() {
                try {
                    const response = await fetch(
                        "http://localhost:5006/auth/check", {credentials: "include"} 
                    );

                    if (response.status === 401) {
                        window.location.href = "http://localhost:5000/login";
                        return false;
                    }

                    if (response.status === 403) {
                        window.location.href = "http://localhost:5000/home";
                        return false;
                    }

                    return response.ok;

                } catch (error) {
                    document.body.innerHTML =
                        "<h2>Unable to verify access.</h2>";

                    return false;
                }
    }

    async function startPage() {
        const authorised = await checkAuth();

        if (!authorised) {
            return;
        }
    }

    startPage();
        function selectWard(wardId) {
            window.location.href = `ward_detail.html?ward_id=${wardId}`;
        }
    </script>
</body>
