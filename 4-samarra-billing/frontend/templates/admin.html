<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Billing - Admin View</title>
    <link rel="stylesheet" href="http://localhost:3000/css/theme.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<nav class="top-nav">
    <div class="top-nav-left">
        <a href="http://localhost:5000/home" class="top-nav-home">&larr; Home</a>
    </div>
</nav>

<div class="app-shell">
    <header class="app-header">
        <h1>Billing &amp; Insurance</h1>
        <p>Admin view — read and write access</p>
    </header>

    <div class="card">
        <h2>Create Invoice</h2>
        <form
            id="create-invoice-form"
            class="invoice-form"
            hx-target="#create-invoice-message"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful) this.reset()"
        >
            <input type="hidden" name="token" id="create-token-field">
            <div>
                <label for="create-patient-id">Patient ID</label>
                <input type="number" id="create-patient-id" name="patient_id" required>
            </div>
            <div>
                <label for="create-insurance-provider-id">Insurance Provider</label>
                <select id="create-insurance-provider-id" name="insurance_provider_id">
                    <option value="">Self-pay</option>
                </select>
            </div>
            <div>
                <label for="create-appointment-cost">Appointment Cost</label>
                <input type="number" step="0.01" id="create-appointment-cost" name="appointment_cost" value="0">
            </div>
            <div>
                <label for="create-medication-cost">Medication Cost</label>
                <input type="number" step="0.01" id="create-medication-cost" name="medication_cost" value="0">
            </div>
            <div>
                <label for="create-bed-charges">Bed Charges</label>
                <input type="number" step="0.01" id="create-bed-charges" name="bed_charges" value="0">
            </div>
            <div>
                <label for="create-status">Status</label>
                <select id="create-status" name="status">
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="partially_paid">Partially paid</option>
                </select>
            </div>
            <button type="submit">Create Invoice</button>
        </form>
        <div id="create-invoice-message"></div>
    </div>

    <div class="card">
        <h2>All Invoices</h2>

        <form
            id="filter-form"
            class="patient-form"
            hx-target="#invoice-table-body"
            hx-trigger="submit, change"
        >
            <input type="hidden" name="token" id="filter-token-field">

            <div>
                <label for="filter-invoice-id">Invoice ID</label>
                <input type="number" id="filter-invoice-id" name="invoice_id" placeholder="Any invoice">
            </div>

            <div>
                <label for="filter-patient-id">Patient ID</label>
                <input type="number" id="filter-patient-id" name="patient_id" placeholder="All patients">
            </div>

            <div>
                <label for="filter-status">Status</label>
                <input type="text" id="filter-status" name="status" placeholder="e.g. pending, paid">
            </div>

            <div>
                <label for="filter-insurance">Insurance</label>
                <input type="text" id="filter-insurance" name="insurance" placeholder="e.g. Medibank, Self-pay">
            </div>

            <div>
                <label for="filter-sort-by">Sort by</label>
                <select id="filter-sort-by" name="sort_by">
                    <option value="">None</option>
                    <option value="id">Invoice ID</option>
                    <option value="patient_id">Patient</option>
                    <option value="total_amount">Total</option>
                    <option value="patient_owed_amount">Owed</option>
                    <option value="status">Status</option>
                </select>
            </div>

            <div>
                <label for="filter-sort-dir">Direction</label>
                <select id="filter-sort-dir" name="sort_dir">
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>
            </div>

            <button type="submit">Apply</button>
        </form>

        <table class="invoice-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Insurance</th>
                    <th>Total</th>
                    <th>Covered</th>
                    <th>Owed</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody
                id="invoice-table-body"
                hx-trigger="load, invoicesChanged from:body"
                hx-swap="innerHTML"
            >
                <tr><td colspan="8">Loading invoices...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Check Invoice Status (MCP)</h2>
        <div id="mcp-result" class="chat-log"></div>
        <form
            id="mcp-form"
            class="chat-form"
            hx-target="#mcp-result"
            hx-swap="beforeend"
            hx-on::after-request="this.reset()"
        >
            <input type="hidden" name="token" id="mcp-token-field">
            <input type="number" name="invoice_id" placeholder="e.g. 1" required>
            <button type="submit">Ask MCP</button>
        </form>
    </div>

    <div class="card">
        <h2>Ask the Knowledge Base (RAG)</h2>
        <div id="rag-result" class="chat-log"></div>
        <form
            id="rag-form"
            class="chat-form"
            hx-target="#rag-result"
            hx-swap="beforeend"
            hx-on::after-request="this.reset()"
        >
            <input type="hidden" name="token" id="rag-token-field">
            <input type="text" name="question" placeholder="e.g. What insurance providers do you accept?" required>
            <button type="submit">Ask RAG</button>
        </form>
    </div>
</div>

<script>
    const token = new URLSearchParams(window.location.search).get("token");

    if (!token) {
        window.location.href = "http://localhost:5000/login";
    }

    document.getElementById("create-token-field").value = token;
    document.getElementById("filter-token-field").value = token;
    document.getElementById("mcp-token-field").value = token;
    document.getElementById("rag-token-field").value = token;

    document.getElementById("create-invoice-form").setAttribute(
        "hx-post", "/invoices/create/html?token=" + encodeURIComponent(token)
    );
    document.getElementById("filter-form").setAttribute(
        "hx-get", "/invoices/html"
    );
    document.getElementById("mcp-form").setAttribute(
        "hx-post", "/ask-mcp/html?token=" + encodeURIComponent(token)
    );
    document.getElementById("rag-form").setAttribute(
        "hx-post", "/ask-rag/html?token=" + encodeURIComponent(token)
    );

    const invoiceTableBody = document.getElementById("invoice-table-body");
    invoiceTableBody.setAttribute("hx-get", "/invoices/html?token=" + encodeURIComponent(token));

    htmx.process(document.body);
    htmx.trigger(invoiceTableBody, "load");

    function toggleEditInvoice(invoiceId) {
        const editRow = document.getElementById("invoice-edit-" + invoiceId);
        editRow.classList.toggle("is-hidden");
    }
    window.toggleEditInvoice = toggleEditInvoice;

    document.body.addEventListener("invoiceCreated", function(event) {
        const invoiceId = event.detail.id;
        window.open("/invoices/" + invoiceId + "/print?token=" + encodeURIComponent(token), "_blank");
    });

    fetch("/insurance-providers")
        .then(function(res) { return res.json(); })
        .then(function(providers) {
            const select = document.getElementById("create-insurance-provider-id");
            providers.forEach(function(provider) {
                const option = document.createElement("option");
                option.value = provider.id;
                option.textContent = provider.name + " - " + provider.plan_type + " (" + provider.coverage_percentage + "%)";
                select.appendChild(option);
            });
        })
        .catch(function() {
            console.error("Could not load insurance providers list.");
        });
</script>
</body>
</html>
