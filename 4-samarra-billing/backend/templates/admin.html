<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Billing - Admin View</title>
    <link rel="stylesheet" href="http://localhost:3000/css/theme.css">
    <link rel="stylesheet" href="http://localhost:3004/css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <h1>Billing &amp; Insurance</h1>
        <p>Admin view — read and write access</p>
    </header>

    <div class="card">
        <h2>Create Invoice</h2>
        <form
            class="invoice-form"
            hx-post="http://localhost:5004/invoices/create/html?token={{ token }}"
            hx-target="#create-invoice-message"
            hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful) this.reset()"
        >
            <div>
                <label for="create-patient-id">Patient ID</label>
                <input type="number" id="create-patient-id" name="patient_id" required>
            </div>

            <div>
                <label for="create-insurance-provider-id">Insurance Provider ID</label>
                <input type="number" id="create-insurance-provider-id" name="insurance_provider_id" placeholder="Leave blank for self-pay">
            </div>

            <div>
                <label for="create-appointment-cost">Appointment Cost</label>
                <input type="number" step="0.01" id="create-appointment-cost" name="appointment_cost" value="0">
            </div>

            <div>
                <label for="create-medication-cost">Medication Cost</label>
                <input type="number" step="0.01" id="create-medication-cost" name="medication_cost" value="0">
            </div>

            <div>
                <label for="create-bed-charges">Bed Charges</label>
                <input type="number" step="0.01" id="create-bed-charges" name="bed_charges" value="0">
            </div>

            <div>
                <label for="create-status">Status</label>
                <select id="create-status" name="status">
                    <option value="pending">Pending</option>
                    <option value="paid">Paid</option>
                    <option value="partially_paid">Partially paid</option>
                </select>
            </div>

            <button type="submit">Create Invoice</button>
        </form>
        <div id="create-invoice-message"></div>
    </div>

    <div class="card">
        <h2>All Invoices</h2>

        <form
            class="patient-form"
            hx-get="http://localhost:5004/invoices/html"
            hx-target="#invoice-table-body"
            hx-trigger="submit, change"
        >
            <input type="hidden" name="token" value="{{ token }}">

            <div>
                <label for="filter-invoice-id">Invoice ID</label>
                <input type="number" id="filter-invoice-id" name="invoice_id" placeholder="Any invoice">
            </div>

            <div>
                <label for="filter-patient-id">Patient ID</label>
                <input type="number" id="filter-patient-id" name="patient_id" placeholder="All patients">
            </div>

            <div>
                <label for="filter-status">Status</label>
                <input type="text" id="filter-status" name="status" placeholder="e.g. pending, paid">
            </div>

            <div>
                <label for="filter-insurance">Insurance</label>
                <input type="text" id="filter-insurance" name="insurance" placeholder="e.g. Medibank, Self-pay">
            </div>

            <div>
                <label for="filter-sort-by">Sort by</label>
                <select id="filter-sort-by" name="sort_by">
                    <option value="">None</option>
                    <option value="id">Invoice ID</option>
                    <option value="patient_id">Patient</option>
                    <option value="total_amount">Total</option>
                    <option value="patient_owed_amount">Owed</option>
                    <option value="status">Status</option>
                </select>
            </div>

            <div>
                <label for="filter-sort-dir">Direction</label>
                <select id="filter-sort-dir" name="sort_dir">
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>
            </div>

            <button type="submit">Apply</button>
        </form>

        <table class="invoice-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Insurance</th>
                    <th>Total</th>
                    <th>Covered</th>
                    <th>Owed</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody
                id="invoice-table-body"
                hx-get="http://localhost:5004/invoices/html?token={{ token }}"
                hx-trigger="load, invoicesChanged from:body"
                hx-swap="innerHTML"
            >
                <tr><td colspan="8">Loading invoices...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Ask About Billing</h2>
        <div id="chat-log" class="chat-log"></div>
        <form
            class="chat-form"
            hx-post="http://localhost:5004/ai/chat/html"
            hx-target="#chat-log"
            hx-swap="beforeend"
            hx-on::after-request="this.reset()"
        >
            <input type="hidden" name="token" value="{{ token }}">
            <input type="text" name="message" placeholder="e.g. Which invoices are still pending?" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <p class="auth-switch"><a href="http://localhost:5000/home">&larr; Back to Home</a></p>
</div>

<script>
function toggleEditInvoice(invoiceId) {
    const editRow = document.getElementById("invoice-edit-" + invoiceId);
    editRow.classList.toggle("is-hidden");
}

document.body.addEventListener("invoiceCreated", function(event) {
    const invoiceId = event.detail.id;
    window.open("http://localhost:5004/invoices/" + invoiceId + "/print?token={{ token }}", "_blank");
});
</script>
</body>
</html>
