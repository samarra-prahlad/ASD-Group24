<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Billing - Admin View</title>
    <link rel="stylesheet" href="http://localhost:3000/css/theme.css">
    <link rel="stylesheet" href="http://localhost:3004/css/styles.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <h1>Billing &amp; Insurance</h1>
        <p>Admin view — read and write access</p>
    </header>

    <div class="card">
        <h2>All Invoices</h2>

        <form
            class="patient-form"
            hx-get="http://localhost:5004/invoices/html"
            hx-target="#invoice-table-body"
            hx-trigger="submit, change"
        >
            <input type="hidden" name="token" value="{{ token }}">

            <div>
                <label for="filter-patient-id">Patient ID</label>
                <input type="number" id="filter-patient-id" name="patient_id" placeholder="All patients">
            </div>

            <div>
                <label for="filter-status">Status</label>
                <select id="filter-status" name="status">
                    <option value="">All</option>
                    <option value="paid">Paid</option>
                    <option value="pending">Pending</option>
                    <option value="partially_paid">Partially paid</option>
                </select>
            </div>

            <div>
                <label for="filter-insurance">Insurance</label>
                <select id="filter-insurance" name="insurance">
                    <option value="">All</option>
                    <option value="Self-pay">Self-pay</option>
                    <option value="Medibank">Medibank</option>
                    <option value="Bupa">Bupa</option>
                    <option value="HCF">HCF</option>
                    <option value="NIB">NIB</option>
                    <option value="Australian Unity">Australian Unity</option>
                    <option value="AHM">AHM</option>
                    <option value="Medicare">Medicare</option>
                </select>
            </div>

            <div>
                <label for="filter-sort-by">Sort by</label>
                <select id="filter-sort-by" name="sort_by">
                    <option value="">None</option>
                    <option value="id">Invoice ID</option>
                    <option value="patient_id">Patient</option>
                    <option value="total_amount">Total</option>
                    <option value="patient_owed_amount">Owed</option>
                    <option value="status">Status</option>
                </select>
            </div>

            <div>
                <label for="filter-sort-dir">Direction</label>
                <select id="filter-sort-dir" name="sort_dir">
                    <option value="asc">Ascending</option>
                    <option value="desc">Descending</option>
                </select>
            </div>

            <button type="submit">Apply</button>
        </form>

        <table class="invoice-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Patient</th>
                    <th>Insurance</th>
                    <th>Total</th>
                    <th>Covered</th>
                    <th>Owed</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody
                id="invoice-table-body"
                hx-get="http://localhost:5004/invoices/html?token={{ token }}"
                hx-trigger="load"
                hx-swap="innerHTML"
            >
                <tr><td colspan="7">Loading invoices...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>Ask About Billing</h2>
        <div id="chat-log" class="chat-log"></div>
        <form
            class="chat-form"
            hx-post="http://localhost:5004/ai/chat/html"
            hx-target="#chat-log"
            hx-swap="beforeend"
            hx-on::after-request="this.reset()"
        >
            <input type="hidden" name="token" value="{{ token }}">
            <input type="text" name="message" placeholder="e.g. Which invoices are still pending?" required>
            <button type="submit">Send</button>
        </form>
    </div>

    <p class="auth-switch"><a href="http://localhost:5000/home">&larr; Back to Home</a></p>
</div>
</body>
</html>
