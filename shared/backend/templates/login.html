<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group 24 — Login</title>
    <link rel="stylesheet" href="http://localhost:3000/css/theme.css">
    <link rel="stylesheet" href="http://localhost:3000/css/login.css">
</head>
<body>
    <div class="login-shell">
        <header class="login-header">
            <h1>Group 24 — Healthcare Microservices App</h1>
            <p>Log in to continue</p>
        </header>

        {% if error %}
        <div class="auth-message auth-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login/html" class="auth-form">
            <label for="login-email">Email address</label>
            <input type="email" id="login-email" name="email_address" required>

            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" required>

            <button type="submit">Log in</button>
        </form>

        <p class="auth-switch">Don't have an account? <a href="/register">Register here</a></p>
    </div>
</body>
</html>
