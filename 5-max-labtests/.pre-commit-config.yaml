# Pre-commit security scans for Feature 5 (Lab Tests).
# Install once with:
#   pre-commit install -c 5-max-labtests/.pre-commit-config.yaml
# Then these run automatically on every `git commit` that touches 5-max-labtests/.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff-check
        name: Ruff security rules (flake8-bandit S)
        args: ["--config=5-max-labtests/ruff.toml"]
        files: ^5-max-labtests/.*\.py$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets (hard-coded credentials)
        args: ["--baseline", "5-max-labtests/.secrets.baseline"]
        files: ^5-max-labtests/

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.0
    hooks:
      - id: pip-audit
        name: pip-audit (known vulnerable dependencies)
        args: ["-r", "5-max-labtests/backend/requirements.txt", "-r", "5-max-labtests/database/requirements.txt"]
        always_run: true
        pass_filenames: false